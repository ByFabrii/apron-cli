# Pruebas en cada push y pull request. Sin secretos ni permisos de escritura: corre igual de seguro en forks.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:js
      - run: node dist/apron.js --version
